<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="塔羅牌占卜 - 探索命運的指引">
    <meta name="theme-color" content="#1a0a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>塔羅牌占卜</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- html2canvas for screenshot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <!-- 星空背景 -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- 主畫面 -->
    <div class="screen active" id="homeScreen">
        <div class="home-content">
            <div class="logo">
                <span class="logo-symbol">✧</span>
                <h1>塔羅牌占卜</h1>
                <span class="logo-symbol">✧</span>
            </div>
            <p class="subtitle">探索命運的神秘指引</p>

            <div class="question-box">
                <label class="question-field-label" for="questionInput">想問的問題（選填）</label>
                <textarea
                    id="questionInput"
                    class="question-input"
                    rows="3"
                    maxlength="300"
                    placeholder="例如：我該不該換工作？這段關係還值得繼續嗎？"
                ></textarea>
                <p class="question-hint">先讓心靜下來，想一想此刻最在意的事。</p>
            </div>

            <h2 class="section-heading">選擇抽牌張數</h2>
            <div class="mode-buttons">
                <button class="mode-btn" id="singleModeBtn">
                    <span class="card-icon" aria-hidden="true">01</span>
                    <span class="mode-title">單張抽牌</span>
                    <span class="mode-desc">獲得今日的靈感指引</span>
                </button>

                <button class="mode-btn" id="threeModeBtn">
                    <span class="card-icon" aria-hidden="true">03</span>
                    <span class="mode-title">三張牌陣</span>
                    <span class="mode-desc" id="threeModeDesc">過去・現在・未來</span>
                </button>

                <button class="mode-btn" id="fiveModeBtn">
                    <span class="card-icon" aria-hidden="true">05</span>
                    <span class="mode-title">五張牌陣</span>
                    <span class="mode-desc" id="fiveModeDesc">深度問題解析</span>
                </button>
            </div>

            <form class="custom-draw" id="customDrawForm">
                <label for="customCountInput">自訂張數</label>
                <div class="custom-draw-controls">
                    <div class="count-field">
                        <input type="number" id="customCountInput" min="1" max="78" step="1"
                            value="4" required inputmode="numeric" aria-describedby="customCountHint">
                        <span aria-hidden="true">張</span>
                    </div>
                    <button class="custom-draw-btn" type="submit">開始抽牌 <span aria-hidden="true">→</span></button>
                </div>
                <p class="question-hint" id="customCountHint">可輸入 1–78 的整數，每次抽牌不重複。</p>
            </form>

            <label class="simple-option" for="simpleModeInput">
                <input type="checkbox" id="simpleModeInput">
                <span>
                    <strong>簡易版・不設定牌位</strong>
                    <span class="option-description">只保留問題、牌名與正逆位，方便交給 AI 自由解讀。取消勾選可使用原有牌位與牌義。</span>
                </span>
            </label>
        </div>
    </div>

    <!-- 抽牌畫面 -->
    <div class="screen" id="drawScreen">
        <button class="back-btn" id="backBtn">← 返回</button>

        <div class="draw-content">
            <h2 class="draw-title" id="drawTitle">點擊卡牌抽牌</h2>
            <div class="question-banner" id="drawQuestionPreview" hidden></div>

            <p class="draw-progress" id="drawProgress" role="status"></p>
            <div class="cards-container" id="cardsContainer">
                <!-- Cards will be dynamically inserted here -->
            </div>

            <div class="draw-hint" id="drawHint">
                <span class="hint-icon">👆</span>
                <span>點擊卡牌揭示命運</span>
            </div>
        </div>
    </div>

    <!-- 結果畫面 -->
    <div class="screen" id="resultScreen">
        <button class="back-btn" id="resultBackBtn">← 返回</button>

        <div class="result-format" role="group" aria-label="結果格式">
            <button id="simpleResultBtn" type="button" aria-pressed="false">簡易版</button>
            <button id="detailedResultBtn" type="button" aria-pressed="true">牌義版</button>
        </div>
        <p class="format-hint" id="resultFormatHint">提供原有牌位與每張牌的牌義；複製給 AI 也使用此格式。</p>

        <div class="result-content" id="resultContent">
            <h2 class="result-title">占卜結果</h2>
            <p class="result-summary" id="resultSummary"></p>
            <div class="question-banner result-question" id="resultQuestion" hidden></div>

            <div class="result-cards" id="resultCards">
                <!-- Result cards will be inserted here -->
            </div>

            <div class="result-meanings" id="resultMeanings">
                <!-- Card meanings will be inserted here -->
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn save-btn" id="saveBtn">
                <span>📥</span> 儲存圖片
            </button>
            <button class="action-btn copy-btn" id="copyTextBtn">
                <span>📋</span> 複製給 AI
            </button>
            <button class="action-btn redraw-btn" id="redrawBtn">
                <span>🔄</span> 重新抽牌
            </button>
        </div>
    </div>

    <!-- 複製成功提示 -->
    <div class="toast" id="toast" role="status">已複製，可直接貼給 AI 解牌</div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>處理中...</p>
    </div>

    <!-- Scripts -->
    <script src="js/tarot-data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
